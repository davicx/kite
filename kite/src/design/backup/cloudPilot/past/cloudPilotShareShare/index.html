<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CloudPilot</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<!-- <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"> -->
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style/style.css">
</head>
<body>

<div id="app">

	<!-- HEADER (full width, 80px) -->
	<header id="header">
		<div class="header-desktop-logo-area">
			<img title="Home Page" src="images/cloud.png" class="desktop-cloud-logo-image" alt="cloud">
		</div>

	

		
		<div class="header-profile">
			<img class="profile-button" src="images/profile.jpg" alt="profile">
		</div>
	</header>

	<div id="body">

		<!-- SIDEBAR -->
		<aside id="sidebar" class="design-2">
		<!-- Flip: class="design-1" (original) | class="design-2" (YouTube) -->

			<nav class="sidebar-nav">
				<div class="nav-item nav-item--active">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
						<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
					</svg>
					<span>Home</span>
				</div>

				<div class="nav-item">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
						<path d="M12 20h9"/>
						<path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
					</svg>
					<span>New Chat</span>
				</div>

				<div class="nav-item">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
						<path d="M9 11l3 3L22 4"/>
						<path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
					</svg>
					<span>To Do</span>
				</div>

				<div class="nav-item">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
						<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
						<circle cx="9" cy="7" r="4"/>
						<path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
						<path d="M16 3.13a4 4 0 0 1 0 7.75"/>
					</svg>
					<span>Friends</span>
				</div>
			</nav>

			<div class="sidebar-section">
				<div class="sidebar-section-title">Projects</div>
				<div class="sidebar-list">
					<div class="sidebar-list-item">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
							<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
						</svg>
						<span>Work</span>
					</div>
					<div class="sidebar-list-item">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
							<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
						</svg>
						<span>CloudPilot</span>
					</div>
					<div class="sidebar-list-item">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
							<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
						</svg>
						<span>Startup</span>
					</div>
					<div class="sidebar-list-item">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
							<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
						</svg>
						<span>Random</span>
					</div>
					<div class="sidebar-list-item">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
							<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
						</svg>
						<span>Code</span>
					</div>
					<div class="sidebar-list-item sidebar-list-item--muted">
						<span>Show more</span>
					</div>
				</div>
			</div>

			<div class="sidebar-section sidebar-section--chats">
				<div class="sidebar-section-title">Chats</div>
				<div class="sidebar-list">
					<div class="sidebar-list-item">EC2 Production Scan</div>
					<div class="sidebar-list-item">Staging RDS Review</div>
					<div class="sidebar-list-item">S3 Bucket Audit</div>
					<div class="sidebar-list-item">Lambda Cost Check</div>
					<div class="sidebar-list-item">IAM Policy Review</div>
				</div>
			</div>

			<div class="sidebar-footer">
				<div class="user-profile">
					<div class="user-avatar">DC</div>
					<div class="user-info">
						<div class="user-name">david charles</div>
						<div class="user-plan">Pro</div>
					</div>
				</div>
				<div class="sidebar-footer-icon" aria-hidden="true">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
						<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
						<line x1="3" y1="6" x2="21" y2="6"/>
						<path d="M16 10a4 4 0 0 1-8 0"/>
					</svg>
				</div>
			</div>

		</aside>

		<!-- MAIN CONTENT -->
		<main id="main">

			<div class="main-top-bar">
				<div class="model-selector" aria-hidden="true">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
						<circle cx="12" cy="12" r="10"/>
						<circle cx="12" cy="12" r="4"/>
					</svg>
				</div>
			</div>

			<div class="main-center">
				<h1 class="greeting">Where should we begin?</h1>

				<div class="input-bar">
					<div class="input-bar-left">
						<span class="input-icon" aria-hidden="true">
							<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
								<line x1="12" y1="5" x2="12" y2="19"/>
								<line x1="5" y1="12" x2="19" y2="12"/>
							</svg>
						</span>
						<span class="input-placeholder">Ask anything</span>
					</div>
					<div class="input-bar-right">
						<span class="instant-label">
							Instant
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<polyline points="6 9 12 15 18 9"/>
							</svg>
						</span>
						<span class="input-icon" aria-hidden="true">
							<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
								<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
								<path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
								<line x1="12" y1="19" x2="12" y2="23"/>
								<line x1="8" y1="23" x2="16" y2="23"/>
							</svg>
						</span>
						<span class="voice-button" aria-hidden="true">
							<svg width="18" height="18" viewBox="0 0 24 24" fill="white" stroke="none">
								<rect x="4" y="10" width="2" height="8" rx="1"/>
								<rect x="8" y="7" width="2" height="14" rx="1"/>
								<rect x="12" y="9" width="2" height="10" rx="1"/>
								<rect x="16" y="6" width="2" height="16" rx="1"/>
							</svg>
						</span>
					</div>
				</div>

				<div class="quick-actions">
					<div class="quick-action">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
							<path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
						</svg>
						<span>Scan EC2</span>
					</div>
					<div class="quick-action">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
							<path d="M12 20h9"/>
							<path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
						</svg>
						<span>Review findings</span>
					</div>
					<div class="quick-action">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
							<circle cx="12" cy="12" r="10"/>
							<line x1="2" y1="12" x2="22" y2="12"/>
							<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
						</svg>
						<span>Look something up</span>
					</div>
				</div>
			</div>

		</main>

	</div>

</div>

</body>
</html>
